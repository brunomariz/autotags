name: Automatically Create Tag

on:
  push:
    branches:
      - main

jobs:
  create_tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        # with:
        #   token: ${{ secrets.GIT_TOKEN }}

      # Create a new tag based on the datetime and commit SHA
      - name: Create Tag
        id: create_tag
        run: |
          git tag -a -m "tag automatically generated by workflow" $(git rev-parse --short HEAD)-$(date +%4Y_%m_%d_z%Z_%H_%M_%S)
          git push $(git rev-parse --short HEAD)-$(date +%4Y_%m_%d_z%Z_%H_%M_%S)
